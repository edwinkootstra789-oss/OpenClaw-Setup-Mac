name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wizard dependencies
        run: npm install

      - name: Clean openclaw-pack for macOS
        run: |
          set -x
          ASSETS_DIR="${{ github.workspace }}/assets"
          cd "$ASSETS_DIR"

          echo "=== Original zip size ==="
          ls -lh openclaw-pack.zip

          echo "=== Listing zip contents (first 60 lines) ==="
          unzip -l openclaw-pack.zip | head -70

          echo "=== Extracting ==="
          rm -rf openclaw-pack-temp
          unzip -o openclaw-pack.zip -d openclaw-pack-temp

          echo "=== Top-level contents ==="
          ls -la openclaw-pack-temp/

          cd openclaw-pack-temp
          TOP_DIR=$(ls -d */ 2>/dev/null | head -1)
          if [ -n "$TOP_DIR" ]; then
            echo "Detected wrapper dir: $TOP_DIR"
            cd "$TOP_DIR"
          fi

          WORK_DIR="$(pwd)"
          echo "=== Working directory: $WORK_DIR ==="
          ls -la

          if [ -f "package.json" ]; then
            echo "=== package.json ==="
            cat package.json
          fi

          echo ""
          echo "=== Checking node_modules ==="
          if [ -d "node_modules" ]; then
            NM_COUNT=$(find node_modules -maxdepth 1 -type d | wc -l | tr -d ' ')
            echo "  node_modules already exists with $NM_COUNT top-level directories"

            echo ""
            echo "=== Removing Windows-only files from node_modules ==="
            find node_modules -name "*.exe" -type f -delete 2>/dev/null
            find node_modules -name "*.cmd" -type f -delete 2>/dev/null
            find node_modules -name "*.dll" -type f -delete 2>/dev/null
            find node_modules -name "*.pdb" -type f -delete 2>/dev/null
            find node_modules -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
            echo "  Windows binaries removed"

            echo ""
            echo "=== node_modules/.bin contents ==="
            ls -la node_modules/.bin/ 2>/dev/null | head -20

            NM_COUNT_AFTER=$(find node_modules -maxdepth 1 -type d | wc -l | tr -d ' ')
            echo "  After cleanup: $NM_COUNT_AFTER top-level directories"
          else
            echo "  WARNING: node_modules not found in zip!"
            echo "  Directory listing:"
            find . -maxdepth 2 -type f | head -30
          fi

          rm -f package-lock.json

          echo ""
          echo "=== Repackaging ==="
          cd "$ASSETS_DIR"
          rm -f openclaw-pack.zip
          cd openclaw-pack-temp
          zip -r ../openclaw-pack.zip .
          cd "$ASSETS_DIR"
          rm -rf openclaw-pack-temp
          echo "=== New zip size ==="
          ls -lh openclaw-pack.zip

      - name: Fix launcher permissions
        run: chmod 755 assets/OpenClaw启动.sh

      - name: Build macOS DMG
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-macOS-DMG
          path: dist/*.dmg
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-macOS-ZIP
          path: dist/*.zip
          retention-days: 30

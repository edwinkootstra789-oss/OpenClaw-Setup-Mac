name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install electron-builder dependencies
        run: npm install

      - name: Rebuild openclaw-pack for macOS
        run: |
          cd assets
          echo "=== Listing zip contents (top 20) ==="
          unzip -l openclaw-pack.zip | head -30
          echo "=== Extracting ==="
          unzip -o openclaw-pack.zip -d openclaw-pack-temp
          echo "=== Top-level contents ==="
          ls -la openclaw-pack-temp/
          cd openclaw-pack-temp
          TOP_DIR=$(ls -d */ 2>/dev/null | head -1)
          if [ -n "$TOP_DIR" ]; then
            echo "Detected wrapper dir: $TOP_DIR"
            cd "$TOP_DIR"
          fi
          echo "=== Current dir: $(pwd) ==="
          ls -la
          echo "=== Removing old node_modules ==="
          rm -rf node_modules
          if [ -f package.json ]; then
            echo "=== Found package.json, running npm install ==="
            NODE_OPTIONS="--max-old-space-size=4096" npm install --production || {
              echo "npm install failed, trying without optional deps"
              NODE_OPTIONS="--max-old-space-size=4096" npm install --production --ignore-optional || {
                echo "npm install failed again"
                exit 1
              }
            }
          else
            echo "WARNING: No package.json found, skipping npm install"
          fi
          echo "=== Repackaging ==="
          cd ../..
          rm -f openclaw-pack.zip
          cd openclaw-pack-temp
          zip -r ../openclaw-pack.zip .
          cd ..
          rm -rf openclaw-pack-temp
          echo "=== Done ==="
          ls -lh openclaw-pack.zip

      - name: Build macOS DMG
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-macOS-DMG
          path: dist/*.dmg
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-macOS-ZIP
          path: dist/*.zip
          retention-days: 30

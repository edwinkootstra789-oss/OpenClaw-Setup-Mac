name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wizard dependencies
        run: npm install

      - name: Rebuild openclaw-pack for macOS
        run: |
          set -x
          ASSETS_DIR="${{ github.workspace }}/assets"
          cd "$ASSETS_DIR"

          echo "=== Original zip size ==="
          ls -lh openclaw-pack.zip

          echo "=== Listing zip contents (first 60 lines) ==="
          unzip -l openclaw-pack.zip | head -70

          echo "=== Extracting ==="
          rm -rf openclaw-pack-temp
          unzip -o openclaw-pack.zip -d openclaw-pack-temp

          echo "=== Top-level contents ==="
          ls -la openclaw-pack-temp/

          cd openclaw-pack-temp
          TOP_DIR=$(ls -d */ 2>/dev/null | head -1)
          if [ -n "$TOP_DIR" ]; then
            echo "Detected wrapper dir: $TOP_DIR"
            cd "$TOP_DIR"
          fi

          WORK_DIR="$(pwd)"
          echo "=== Working directory: $WORK_DIR ==="
          ls -la

          if [ -f "package.json" ]; then
            echo "=== package.json ==="
            cat package.json

            echo ""
            echo "=== Removing Windows node_modules and lock file ==="
            rm -rf node_modules
            rm -f package-lock.json

            echo "=== Copying tgz to correct location ==="
            TGZ_NAME="openclaw-2026.5.18.tgz"
            TGZ_SRC="$ASSETS_DIR/$TGZ_NAME"
            TGZ_DST="$(dirname "$WORK_DIR")/$TGZ_NAME"
            if [ -f "$TGZ_SRC" ]; then
              cp "$TGZ_SRC" "$TGZ_DST"
              echo "  Copied: $TGZ_SRC -> $TGZ_DST"
              ls -lh "$TGZ_DST"
            else
              echo "  ERROR: $TGZ_SRC not found!"
              find "$ASSETS_DIR" -name "*.tgz" -type f 2>/dev/null
              exit 1
            fi

            echo ""
            echo "=== npm install (macOS native) ==="
            NODE_OPTIONS="--max-old-space-size=8192" npm install --force --omit=dev 2>&1 && {
              echo ">>> npm install SUCCEEDED"
            } || {
              echo ">>> Attempt 1 FAILED"
              rm -rf node_modules
              echo "=== Attempt 2: npm install --force --omit=dev --ignore-scripts ==="
              NODE_OPTIONS="--max-old-space-size=8192" npm install --force --omit=dev --ignore-scripts 2>&1 && {
                echo ">>> Attempt 2 SUCCEEDED"
              } || {
                echo ">>> Attempt 2 FAILED"
                rm -rf node_modules
                echo "=== Attempt 3: npm install --force --legacy-peer-deps --ignore-scripts ==="
                NODE_OPTIONS="--max-old-space-size=8192" npm install --force --legacy-peer-deps --ignore-scripts 2>&1 && {
                  echo ">>> Attempt 3 SUCCEEDED"
                } || {
                  echo ">>> All npm install attempts FAILED"
                  exit 1
                }
              }
            }

            echo ""
            echo "=== Verification ==="
            if [ -d "node_modules" ]; then
              NM_COUNT=$(find node_modules -maxdepth 1 -type d | wc -l | tr -d ' ')
              echo "  node_modules packages: $NM_COUNT"
              echo "  node_modules/.bin contents:"
              ls -la node_modules/.bin/ 2>/dev/null | head -20
            else
              echo "  ERROR: node_modules missing after install!"
              exit 1
            fi
          else
            echo "ERROR: No package.json found in $WORK_DIR"
            find . -maxdepth 2 -type f | head -30
            exit 1
          fi

          rm -f "$TGZ_DST"

          echo ""
          echo "=== Repackaging ==="
          cd "$ASSETS_DIR"
          rm -f openclaw-pack.zip
          cd openclaw-pack-temp
          zip -r ../openclaw-pack.zip .
          cd "$ASSETS_DIR"
          rm -rf openclaw-pack-temp
          echo "=== New zip size ==="
          ls -lh openclaw-pack.zip

      - name: Fix launcher permissions
        run: chmod 755 assets/OpenClaw启动.sh

      - name: Build macOS DMG
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-macOS-DMG
          path: dist/*.dmg
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-macOS-ZIP
          path: dist/*.zip
          retention-days: 30

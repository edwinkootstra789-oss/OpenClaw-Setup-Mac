name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wizard dependencies
        run: npm install

      - name: Rebuild openclaw-pack for macOS
        run: |
          set -x
          ASSETS_DIR="${{ github.workspace }}/assets"
          cd "$ASSETS_DIR"

          echo "=== Zip file size ==="
          ls -lh openclaw-pack.zip

          echo "=== Listing zip contents (first 50 lines) ==="
          unzip -l openclaw-pack.zip | head -60

          echo "=== Extracting ==="
          rm -rf openclaw-pack-temp
          unzip -o openclaw-pack.zip -d openclaw-pack-temp

          echo "=== Top-level contents ==="
          ls -la openclaw-pack-temp/

          cd openclaw-pack-temp
          TOP_DIR=$(ls -d */ 2>/dev/null | head -1)
          if [ -n "$TOP_DIR" ]; then
            echo "Detected wrapper dir: $TOP_DIR"
            cd "$TOP_DIR"
          fi

          WORK_DIR="$(pwd)"
          echo "=== Working directory: $WORK_DIR ==="
          ls -la

          echo "=== Removing old node_modules and lock file ==="
          rm -rf node_modules
          rm -f package-lock.json

          if [ -f package.json ]; then
            echo "=== package.json contents ==="
            cat package.json

            echo ""
            echo "=== Attempt 1: npm install --force --production ==="
            NODE_OPTIONS="--max-old-space-size=8192" npm install --force --production 2>&1 && {
              echo ">>> Attempt 1 SUCCEEDED"
            } || {
              echo ">>> Attempt 1 FAILED"
              rm -rf node_modules
              echo "=== Attempt 2: npm install --force --production --ignore-scripts ==="
              NODE_OPTIONS="--max-old-space-size=8192" npm install --force --production --ignore-scripts 2>&1 && {
                echo ">>> Attempt 2 SUCCEEDED"
              } || {
                echo ">>> Attempt 2 FAILED"
                rm -rf node_modules
                echo "=== Attempt 3: npm install --force --legacy-peer-deps --ignore-scripts ==="
                NODE_OPTIONS="--max-old-space-size=8192" npm install --force --legacy-peer-deps --ignore-scripts 2>&1 && {
                  echo ">>> Attempt 3 SUCCEEDED"
                } || {
                  echo ">>> All npm install attempts FAILED"
                  echo ">>> Continuing build without rebuilt node_modules"
                }
              }
            }
          else
            echo "WARNING: No package.json found in $WORK_DIR"
            echo "=== Directory listing (max depth 2) ==="
            find . -maxdepth 2 -type f | head -30
          fi

          echo "=== Repackaging ==="
          cd "$ASSETS_DIR"
          rm -f openclaw-pack.zip
          cd openclaw-pack-temp
          zip -r ../openclaw-pack.zip .
          cd "$ASSETS_DIR"
          rm -rf openclaw-pack-temp
          echo "=== New zip size ==="
          ls -lh openclaw-pack.zip

      - name: Build macOS DMG
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-macOS-DMG
          path: dist/*.dmg
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-macOS-ZIP
          path: dist/*.zip
          retention-days: 30
